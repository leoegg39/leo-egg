","Eternal","Abyss Ocean"],["Dodo Egg","Rare","Prehistoric"],["Pterodactyl Egg","Legendary","Prehistoric"],["Ankylosaurus Egg","Mythic","Prehistoric"],["Triceratops Egg","Cosmic","Prehistoric"],["Bronto Egg","Cosmic","Prehistoric"],["T-Rex Egg","Secret","Prehistoric"],["Tralaledon Egg","Secret","Prehistoric"],["Mosasaurus Egg","Eternal","Prehistoric"],["Centapede Egg","Epic","Cosmic"],["Cosmic Gecko Egg","Legendary","Cosmic"],["Cosmic Gorilla Egg","Mythic","Cosmic"],["La Vacca Saturno Saturnita Egg","Cosmic","Cosmic"],["Cosmic Skeleton Boss Egg","Secret","Cosmic"],["Cosmic Dragon Egg","Secret","Cosmic"],["Eternal Lunar Dragon Egg","Eternal","Cosmic"],["Unicorn Egg","Divine","Cosmic"],["Crane Egg","Epic","Cherry Blossom"],["Salamander Egg","Legendary","Cherry Blossom"],["Red Panda Egg","Mythic","Cherry Blossom"],["Snowy Owl Egg","Cosmic","Cherry Blossom"],["Koi Egg","Cosmic","Cherry Blossom"],["Stag Egg","Secret","Cherry Blossom"],["Oni Tiger Egg","Eternal","Cherry Blossom"],["Kitsune Egg","Divine","Cherry Blossom"],["Spideron Egg","Legendary","Titan Temple"],["Crustacia Egg","Legendary","Titan Temple"],["Bladehide Egg","Mythic","Titan Temple"],["Mantaris Egg","Cosmic","Titan Temple"],["Rhinotaur Egg","Cosmic","Titan Temple"],["Mutant Shark Egg","Secret","Titan Temple"],["Gorilla King Egg","Eternal","Titan Temple"],["Nightflame Egg","Divine","Titan Temple"],["Flame Sprite Egg","Legendary","Angels & Demons"],["Light Dove Egg","Legendary","Angels & Demons"],["Toro Egg","Mythic","Angels & Demons"],["Winged Lamb Egg","Mythic","Angels & Demons"],["Imp Egg","Cosmic","Angels & Demons"],["Sacred Moth Egg","Cosmic","Angels & Demons"],["Demon Hound Egg","Cosmic","Angels & Demons"],["Holy Peacock Egg","Cosmic","Angels & Demons"],["Gargoyle Egg","Secret","Angels & Demons"],["Pure Jellyfish Egg","Secret","Angels & Demons"],["Centaur Egg","Secret","Angels & Demons"],["RazorFang Egg","Secret","Angels & Demons"],["Pegasus Egg","Eternal","Angels & Demons"],["Skeleton Horse Egg","Eter function history(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function save(h){localStorage.setItem(KEY,JSON.stringify(h.slice(-200)))}
function predictionModel(){
 const ss=loadJ(SKEY).filter(x=>Number.isFinite(Number(x.t))).sort((a,b)=>a.t-b.t);
 if(ss.length<12)return {ready:false,n:ss.length,reason:'データ不足'};
 const gaps=[]; for(let i=1;i<ss.length;i++){const g=(ss[i].t-ss[i-1].t)/60000;if(g>0&&g<360)gaps.push(g)}
 const recentAge=(Date.now()-ss[ss.length-1].t)/86400000;
 return {ready:true,n:ss.length,recentAge,confidence:ss.length>=50&&recentAge<=7?'high':ss.length>=25?'medium':'low'};
}
function scoreCandidates(ss){
 const now=Date.now(), nd=new Date(now), hour=nd.getHours(), dow=nd.getDay(), rows={};
 ss.forEach((x,i)=>{
   const name=liveEggName(x), d=new Date(Number(x.t));
   if(!rows[name])rows[name]={name,count:0,hour:0,dow:0,after:{},recent:0};
   const r=rows[name]; r.count++;
   const dh=Math.min(Math.abs(d.getHours()-hour),24-Math.abs(d.getHours()-hour));
   if(dh<=1)r.hour++;
   if(d.getDay()===dow)r.dow++;
   const ageH=Math.max(0,(now-Number(x.t))/3600000);
   r.recent+=Math.exp(-ageH/18);
   if(i>0){const prev=liveEggName(ss[i-1]);r.after[prev]=(r.after[prev]||0)+1}
 });
 const last=ss.length?liveEggName(ss[ss.length-1]):'';
 const total=Math.max(1,ss.length), recentMax=Math.max(1,...Object.values(rows).map(r=>r.recent));
 return Object.values(rows).map(r=>{
   const base=r.count/total, hourRate=r.hour/Math.max(1,r.count), dowRate=r.dow/Math.max(1,r.count);
   const follow=(r.after[last]||0)/Math.max(1,r.count), recentRate=r.recent/recentMax;
   return {...r,score:base*.20+hourRate*.15+dowRate*.10+follow*.25+recentRate*.30};
 }).sort((a,b)=>b.score-a.score);
}
function lightEggPrediction(){
 const hs=history().filter(x=>x&&Number.isFinite(Number(x.t))&&(x.egg==='光卵'||x.egg==='光卵・特大')).sort((a,b)=>a.t-b.t);
 if(hs.length<3)return {ready:false,n:hs.length};
 const gaps=[]; for(let i=1;i<hs.length;i++){const g=(hs[i].t-hs[i-1].t)/60000;if(g>=5&&g<=720)gaps.push(g)}
 if(gaps.length<2)return {ready:false,n:hs.length};
 const sorted=gaps.slice(-30).sort((a,b)=>a-b), med=sorted[Math.floor(sorted.length/2)];
 const last=hs[hs.length-1].t, elapsed=(Date.now()-last)/60000, ratio=elapsed/Math.max(5,med);
 const now=new Date(), sameHour=hs.filter(x=>{const d=new Date(x.t);return Math.abs(d.getHours()-now.getHours())<=1}).length;
 const hourBoost=Math.min(.25,sameHour/Math.max(8,hs.length));
 let score=Math.min(1,ratio*.55+hourBoost);
 let label='まだ弱い',klass='miss';
 const gapClose=Math.abs(elapsed-med)<=Math.max(5,med*.12);
 if(hs.length>=15&&score>=.97&&gapClose&&sameHour>=3){label='🌈 超激アツ';klass='superhot'}
 else if(hs.length>=8&&score>=.9){label='🔥 激アツ';klass='hot'}
 else if(score>=.65){label='✨ 注目';klass='chance'}
 return {ready:true,n:hs.length,med,last,elapsed,score,label,klass};
}
function renderLightPrediction(){
 const box=$('#lightPred'); if(!box)return;
 const p=lightEggPrediction(), base=nextBoundary();
 if(!p.ready){box.innerHTML='<div class="small muted">光卵の実記録 '+p.n+'件。まず3件以上たまると間隔学習を開始します。出たら「✨ 光卵」を押してね。</div>';return}
 const next=new Date(Math.max(base,p.last+p.med*60000)).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
 box.innerHTML=`<div class="row"><div class="n">✨</div><div><div class="egg">光卵</div><div class="time">次の候補 ${next} ／ 実記録 ${p.n}件 ／ 中央間隔 約${Math.round(p.med)}分</div></div><div class="tag ${p.klass}">${p.label}</div></div>`;
}
function render(){
 const m=predictionModel(), ss=loadJ(SKEY).filter(x=>Number.isFinite(Number(x.t))).sort((a,b)=>a.t-b.t);
 if(!m.ready){
   $('#rows').innerHTML='<div class="small muted">📊 データ不足：過去Spawn '+m.n+'件。根拠のない「🔥激アツ」は表示しません。</div>';
   renderLightPrediction();stats();return;
 }
 const ranked=scoreCandidates(ss).slice(0,5), base=nextBoundary();
 const recentManual=history().filter(x=>x&&Number.isFinite(Number(x.t))).sort((a,b)=>b.t-a.t).slice(0,3);
 const normalMisses=recentManual.filter(x=>x.egg==='通常卵').length;
 const safeHot=m.confidence==='high'&&normalMisses<2;
 const note=normalMisses>=2?'直近ノーマル多発・激アツ抑制中':m.confidence==='high'?'高信頼':m.confidence==='medium'?'参考予想':'低信頼';
 $('#rows').innerHTML='<div class="small muted" style="margin-bottom:8px">📊 予想v4 ／ '+note+' ／ '+ss.length+'件学習</div>'+ranked.map((r,i)=>{
   const when=new Date(base+i*5*60000).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
   let label='普通',klass='miss';
   if(i===0&&safeHot){label='🔥 爆激アツ';klass='superhot'}
   else if(i===0&&m.confidence!=='low'){label='🔥 激アツ';klass='hot'}
   else if(i<3){label='✨ 光';klass='chance'}
   const pct=Math.round(r.count/Math.max(1,ss.length)*100);
   return `<div class="row"><div class="n">${i+1}</div><div><div class="egg">${r.name}</div><div class="time">次回目安 ${when} ／ 履歴 ${r.count}回（${pct}%）</div></div><div class="tag ${klass}">${label}</div></div>`;
 }).join('');
 renderLightPrediction();stats();
}
async function syncHistoryForPrediction(){
 try{
   const res=await fetch(LIVE_JSON+'?history='+Date.now(),{cache:'no-store'}); if(!res.ok)return;
   const j=await res.json(), xs=Array.isArray(j.spawns)?j.spawns:[];
   xs.forEach(x=>{if(Number.isFinite(Number(x.ts)))addAutoSpawn(x)});
 }catch(e){}
}
function stats(){
 const h=history(), ss=loadJ(SKEY);
 $('#stats').innerHTML=`<span class="badge">手動メモ ${h.length}件</span><span class="badge">自動実データ ${ss.length}件</span><br><span class="muted">予測は自動取得した実Spawnだけを使用します。</span>`;
}
function nextBoundary(){
 const step=5*60*1000;
 return Math.ceil((Date.now()+1)/step)*step;
}
function tick(){
 let left=nextBoundary()-Date.now(); if(left<0)left=0;
 let m=Math.floor(left/60000),s=Math.floor((left%60000)/1000);
 $('#timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
 if(left<1200 && soundOn && !window._beeped){beep(900,.12);window._beeped=true}
 if(left>20000)window._beeped=false;
}
function beep(f,d){try{let a=new (AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.value=.08;o.start();o.stop(a.currentTime+d)}catch(e){}}
document.querySelectorAll('[data-egg]').forEach(b=>b.onclick=()=>{let h=history(),now=Date.now(),spawnT=Math.floor(now/W)*W;h.push({t:spawnT,egg:b.dataset.egg,recordedAt:now});save(h);render();if(soundOn)beep(b.dataset.egg==='光卵・特大'?1200:700,.15)});
$('#undo').onclick=()=>{let h=history();h.pop();save(h);render()};
$('#recalc').onclick=render;
$('#sound').onclick=()=>{soundOn=true;beep(700,.1);$('#sound').textContent='🔊 音ON'};

   const j=await r.json();
   if(!r.ok||!j.ok)throw new Error(j.error||'relay');
   const state=j.paused?'⚠️ 配信元停止':(j.stale?'⚠️ Liveデータ未提供':'Live取得OK'); $('#external').innerHTML=`<span class="badge">中継接続OK</span> ${state}／取得 ${j.spawns.length}件`;

 let sel=$('#bio'), strip=$('#areaStrip'), wrap=$('#catalogWrap'); if(!sel)return;

  $('#eggdb').innerHTML=a.map(x=>`<div style="padding:13px 4px;border-bottom:1px solid #334b67;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:17px">${x[0]}</b><span class="badge">${x[1]}</span><span class="muted">${x[2]}</span></div>`).join('') || '<span class="muted">このエリアの卵名は追加待ち</span>';

function loadJ(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return []}}
function saveJ(k,v){localStorage.setItem(k,JSON.stringify(v.slice(-300)))}
function dayTimeToTs(hm){let [h,m]=hm.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);return d.getTime()}
function fmtTs(t){let d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function norm(x){return (x||'').toLowerCase().replace(/egg/g,'').replace(/[^a-z0-9]/g,'')}
function renderIntel(){
 let ss=loadJ(SKEY).sort((a,b)=>b.t-a.t);
 const acc=$('#accuracy'); if(acc) acc.innerHTML=`<span class="badge">自動記録 ${ss.length}件</span>`;
 renderLatestFocus();
 const spawnList=$('#spawnList'); if(spawnList) spawnList.innerHTML=ss.slice(0,20).map(sp=>`<div class="preditem"><b>🚨 ${sp.egg}</b> <span class="pill">${sp.rarity||'Rare'}</span> <span class="pill">${sp.loc||'場所不明'}</span><br>${fmtTs(sp.t)} <span class="muted">${sp.source||'Live source'}</span></div>`).join('')||'<span class="muted">🟡 データ待機中｜実Spawn 0件</span>';
}
function extractLiveSpawns(html){
 const doc=new DOMParser().parseFromString(html,'text/html');
 const text=(doc.body?.innerText||'').replace(/\r/g,'');
 let out=[];
 // Parse conservative text patterns only; never invent missing fields.
 const blocks=text.split(/\n{2,}/);
 for(const b of blocks){
   if(!/(Secret|Eternal|Divine|rare egg|spawn)/i.test(b)) continue;
   let tm=b.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
   let rarity=(b.match(/\b(Secret|Eternal|Divine)\b/i)||[])[1]||'Rare';
   let loc=(b.match(/(?:Biome|Location)\s*[:\-]\s*([^\n]+)/i)||[])[1]||'';
   let lines=b.split('\n').map(x=>x.trim()).filter(Boolean);
   let egg=lines.find(x=>/egg$/i.test(x)&&!/rare eggs/i.test(x))||'';
   if(!egg){let m=b.match(/(?:Secret|Eternal|Divine)\s+(?:Egg\s*)?[:\-]?\s*([^\n]+)/i); if(m)egg=m[1].trim()}
   if(egg&&tm) out.push({egg,loc,hm:tm[0],rarity});
 }
 return out;
}
function liveEggName(x){
 const raw=String(x.pet||x.egg||'').trim();
 if(!raw)return 'Unknown Egg';
 let slug=raw;
 const m=raw.match(/\/([^/]+?)-s\.webp(?:\?.*)?$/i); if(m)slug=m[1];
 slug=slug.replace(/^.*\//,'').replace(/-egg$/i,'').replace(/[-_]+/g,' ').trim();
 const key=norm(slug);
 const hit=REAL_EGGS.find(e=>norm(e[0])===key);
 if(hit)return hit[0];
 return slug.replace(/\b\w/g,ch=>ch.toUpperCase())+' Egg';
}
function repairSpawnHistory(){
 let a=loadJ(SKEY), changed=false;
 a=a.map(z=>{
   const egg=liveEggName(z);
   const t=Number(z.ts)||Number(z.t);
   const id=norm(egg)+'|'+Math.floor(t/60000);
   if(egg!==z.egg||id!==z.id||t!==z.t)changed=true;
   return {...z,id,egg,t};
 }).filter(z=>Number.isFinite(z.t)&&z.egg!=='Unknown Egg');
 if(changed)saveJ(SKEY,a);
}
function addAutoSpawn(x){
 let a=loadJ(SKEY), t=Number(x.ts)||Number(x.t)||dayTimeToTs(x.hm), egg=liveEggName(x), id=norm(egg)+'|'+Math.floor(t/60000);
 if(a.some(z=>(z.id||'')===id))return false;
 a.push({id,egg,loc:x.loc||x.biome||'',t,rarity:x.rarity||'Rare',source:'Eggipedia Live'});saveJ(SKEY,a);return true;
}
let lastAuto=0;
async function autoPoll(){
 const st=$('#autoStatus'), ext=$('#external'); lastAuto=Date.now();
 st.innerHTML='<span class="badge">接続中</span> 公開Liveを確認中…';
 try{
   const r=await Promise.reject(new Error('Netlify disabled in GitHub Pages v2'));
   const j=await r.json();
   if(!r.ok||!j.ok) throw new Error(j.error||('HTTP '+r.status));
   const paused=!!j.paused, xs=(j.spawns||[]), health=j.health||'', diag=j.diagnostics||{};
   let added=0; xs.forEach(x=>{if(addAutoSpawn(x))added++});
   renderIntel(); render();
   const feedEmpty=!!j.stale || (xs.length===0);
   const now=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
   st.innerHTML=`<span class="badge">自動監視ON</span> 最終確認 ${now}${paused?' ／ ⏸ 配信元が一時停止中':(!feedEmpty?' ／ ✅ Live受信中':' ／ ⏳ 新着待ち')}`;
   ext.innerHTML=`<span class="badge">Netlify中継OK</span> ${paused?'Eggipedia側アラート一時停止':(feedEmpty?'公開Live実データ未取得':'Live取得OK')}／今回 ${xs.length}件／新規 ${added}件<br><span class="muted">元ページ HTTP ${diag.sourceStatus||'?'} ／ 候補Feed ${diag.candidates||0} ／ 確認Feed ${diag.checkedFeeds||0}</span>`;
   $('#autoLatest').innerHTML=added?`<span class="ok">🚨 新しいSpawn ${added}件を自動登録</span>`:(paused?'<span class="muted">⏸ 公開元のアラートが停止中です。復帰後は自動で監視を再開します。</span>':(feedEmpty?'<span class="muted">⏳ 新しいSpawnを待っています（0件＝Spawnなしとは断定しません）</span>':'<span class="muted">取得データ内に新規Spawnなし</span>'));
   if(added&&soundOn)beep(1200,.3);
 }catch(e){
   st.innerHTML=`<span class="badge">自動監視待機</span> Netlify中継を確認できません。60秒後に再試行します。`;
   ext.innerHTML='<span class="badge">取得待ち</span> 配信停止・取得失敗時はデータを作らず再試行します。';
 }
}
async function readGitHubLive(){
 const st=$('#autoStatus'), ext=$('#external');
 if(!st||!ext)return;
 try{
  const r=await fetch(LIVE_JSON+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json(), xs=Array.isArray(j.spawns)?j.spawns:[]; let added=0;
  xs.forEach(x=>{if(addAutoSpawn(x))added++}); renderIntel();render();
  const checked=j.checkedAt?new Date(j.checkedAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'準備中';
  st.innerHTML=`<span class="badge">GitHub自動監視 v6</span> 最終取得 ${checked}`;
  if(j.paused){st.innerHTML='<span class="badge">⏸ 自動待機中</span> EggipediaのLive通知が停止中。復帰したら自動取得します。';ext.innerHTML=`<span class="badge">公開元停止中</span> Alerts paused ／ 実データ ${xs.length}件`;}else{st.innerHTML=`<span class="badge">🟢 自動監視中</span> 最終取得 ${checked}`;ext.innerHTML=xs.length
 ? `<span class="badge">🟢 自動取得中</span> 実Spawn ${xs.length}件 ／ 新規 ${added}件`
 : '<span class="badge">🟡 データ待機中</span> 実Spawn 0件 ／ 公開Liveの新着待ち';}
 }catch(e){ext.innerHTML='<span class="badge">取得待ち</span> GitHub自動取得データを待っています。';st.innerHTML='<span class="badge">LEO EGG v6.7</span> 起動OK ／ データ待ち';}
}
async function setupHotNotification(){
 const b=$('#notifyHot'), s=$('#notifyHotStatus'); if(!b||!s)return;
 if(!('Notification' in window)){s.textContent='この環境では通知を利用できません';return}
 try{
  const p=await Notification.requestPermission();
  if(p==='granted'){
   localStorage.setItem('leoHotNotify','1');
   b.textContent='🔔 激アツ通知 ON';
   s.textContent='🔥 激アツだけ通知します。通常・チャンスは通知しません。';
   new Notification('LEO EGG 🔥',{body:'激アツ通知をONにしました',icon:'./icon-192.png'});
  }else{s.textContent='通知が許可されていません';}
 }catch(e){s.textContent='ホーム画面のLEO EGGから通知をONにしてください';}
}
function refreshHotNotify(){
 const b=$('#notifyHot'); if(!b)return;
 if(('Notification' in window)&&Notification.permission==='granted'&&localStorage.getItem('leoHotNotify')==='1') b.textContent='🔔 激アツ通知 ON';
}
const _notifyHot=$('#notifyHot'); if(_notifyHot){_notifyHot.onclick=setupHotNotification; refreshHotNotify();}
const _autoNow=$('#autoNow'); if(_autoNow)_autoNow.onclick=readGitHubLive;
const liveBtn=document.createElement('a');
liveBtn.href=LIVE_URL;
liveBtn.target='_blank'; liveBtn.rel='noopener';
liveBtn.className='action'; liveBtn.style.cssText='display:block;text-align:center;text-decoration:none;margin-top:12px';
liveBtn.textContent='🥚 公開Liveを確認';
if(_autoNow)_autoNow.insertAdjacentElement('afterend',liveBtn);
renderIntel();
// PWA版: Netlify Functionsの自動呼び出しは停止。必要時のみ『今すぐチェック』で1回実行。
repairSpawnHistory();eggDB();render();renderLightPrediction();tick();setInterval(tick,250);setInterval(render,30000);
syncHistoryForPrediction().then(()=>{renderIntel();render();});

if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js?v=743',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
}
