function openManualDB(){
 return new Promise((resolve,reject)=>{
  try{
   const q=indexedDB.open(MANUAL_DB,1);
   q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(MANUAL_STORE))q.result.createObjectStore(MANUAL_STORE)};
   q.onsuccess=()=>resolve(q.result); q.onerror=()=>reject(q.error);
  }catch(e){reject(e)}
 });
}
async function idbLoadManual(){
 try{
  const db=await openManualDB();
  return await new Promise(resolve=>{
   const q=db.transaction(MANUAL_STORE,'readonly').objectStore(MANUAL_STORE).get(MANUAL_ID);
   q.onsuccess=()=>resolve(validManual(q.result&&q.result.items?q.result.items:q.result));
   q.onerror=()=>resolve([]);
  });
 }catch(e){return []}
}
async function idbSaveManual(items){
 try{
  const db=await openManualDB();
  await new Promise((resolve,reject)=>{
   const tx=db.transaction(MANUAL_STORE,'readwrite');
   tx.objectStore(MANUAL_STORE).put({savedAt:Date.now(),items:validManual(items)},MANUAL_ID);
   tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
  });
 }catch(e){}
}
function validManual(a){return Array.isArray(a)?a.filter(x=>x&&Number.isFinite(Number(x.t))&&x.egg):[]}

function mergeManual(groups){

 return out.slice(-500);
}

function predictionModel(){
 const ss=loadJ(SKEY).filter(x=>Number.isFinite(Number(x.t))).sort((a,b)=>a.t-b.t);
 if(ss.length<12)return {ready:false,n:ss.length,reason:'データ不足'};
 const gaps=[]; for(let i=1;i<ss.length;i++){const g=(ss[i].t-ss[i-1].t)/60000;if(g>0&&g<360)gaps.push(g)}
 const recentAge=(Date.now()-ss[ss.length-1].t)/86400000;
 return {ready:true,n:ss.length,recentAge,confidence:ss.length>=50&&recentAge<=7?'high':ss.length>=25?'medium':'low'};
}
function scoreCandidates(ss){
 const now=Date.now(), nd=new Date(now), hour=nd.getHours(), minute=nd.getMinutes(), rows={};
 ss.forEach((x,i)=>{
   const name=liveEggName(x), d=new Date(Number(x.t));
   if(!rows[name])rows[name]={name,count:0,hour:0,slot:0,after:{},recent:0,veryRecent:0};
   const r=rows[name]; r.count++;
   const dh=Math.min(Math.abs(d.getHours()-hour),24-Math.abs(d.getHours()-hour));
   if(dh<=1)r.hour++;
   const dm=Math.abs(d.getMinutes()-minute); if(Math.min(dm,60-dm)<=10)r.slot++;
   const ageH=Math.max(0,(now-Number(x.t))/3600000);
   r.recent+=Math.exp(-ageH/18);
   r.veryRecent+=Math.exp(-ageH/4);
   if(i>0){const prev=liveEggName(ss[i-1]);r.after[prev]=(r.after[prev]||0)+1}
 });
 const last=ss.length?liveEggName(ss[ss.length-1]):'', total=Math.max(1,ss.length);
 const recentMax=Math.max(1,...Object.values(rows).map(r=>r.recent));
 const veryRecentMax=Math.max(1,...Object.values(rows).map(r=>r.veryRecent));
 return Object.values(rows).map(r=>{
   const base=r.count/total, hourRate=r.hour/Math.max(1,r.count), slotRate=r.slot/Math.max(1,r.count);
   const follow=(r.after[last]||0)/Math.max(1,r.count);
   const recentRate=r.recent/recentMax, veryRecentRate=r.veryRecent/veryRecentMax;
   return {...r,score:base*.08+hourRate*.15+slotRate*.15+follow*.27+recentRate*.15+veryRecentRate*.20};
 }).sort((a,b)=>b.score-a.score);
}
function lightEggPrediction(){
 const hs=history().filter(x=>x&&Number.isFinite(Number(x.t))&&(x.egg==='光卵'||x.egg==='光卵・特大')).sort((a,b)=>a.t-b.t);
 if(hs.length<3)return {ready:false,n:hs.length};
 const gaps=[]; for(let i=1;i<hs.length;i++){const g=(hs[i].t-hs[i-1].t)/60000;if(g>=5&&g<=720)gaps.push(g)}
 if(gaps.length<2)return {ready:false,n:hs.length};
 const sorted=gaps.slice(-30).sort((a,b)=>a-b), med=sorted[Math.floor(sorted.length/2)];
 const last=hs[hs.length-1].t, elapsed=(Date.now()-last)/60000, ratio=elapsed/Math.max(5,med);
 const now=new Date(), sameHour=hs.filter(x=>{const d=new Date(x.t);return Math.abs(d.getHours()-now.getHours())<=1}).length;
 const hourBoost=Math.min(.25,sameHour/Math.max(8,hs.length));
 let score=Math.min(1,ratio*.55+hourBoost);
 let label='まだ弱い',klass='miss';
 const gapClose=Math.abs(elapsed-med)<=Math.max(5,med*.12);
 if(hs.length>=15&&score>=.97&&gapClose&&sameHour>=3){label='🌈 超激アツ';klass='superhot'}
 else if(hs.length>=8&&score>=.9){label='🔥 激アツ';klass='hot'}
 else if(score>=.65){label='✨ 注目';klass='chance'}
 return {ready:true,n:hs.length,med,last,elapsed,score,label,klass};
}

function renderTargetPrediction(){

 const ss=loadJ(SKEY).filter(x=>Number.isFinite(Number(x.t))).sort((a,b)=>a.t-b.t);
 const now=Date.now(), catalog=eternalCatalog();
 const eternal=ss.filter(x=>{
   const name=liveEggName(x), info=REAL_EGGS.find(e=>e[0]===name);
   return !!(info&&info[1]==='Eternal');
 });

 function nextFromRows(rows){
   if(rows.length<2)return null;
   const gaps=[];
   for(let i=1;i<rows.length;i++){
     const g=Number(rows[i].t)-Number(rows[i-1].t);
     if(g>=10*60000&&g<=48*3600000)gaps.push(g);
   }
   if(!gaps.length)return null;
   const gs=gaps.slice(-24).sort((a,b)=>a-b), med=gs[Math.floor(gs.length/2)];
   let t=Number(rows[rows.length-1].t)+med;
   while(t<=now)t+=med;
   return {t,med};
 }
 const areas=[...new Set(catalog.map(x=>x.loc))].map(loc=>{

   });

   return {loc,rows,man,pred};
 });
 const ranked=areas.filter(a=>a.pred).sort((a,b)=>a.pred.t-b.pred.t);
 const soon=ranked.slice(0,5);

 }).join(''):'<div class="targetbox"><b>⚪ まだエリア別の間隔学習中</b><div class="targetmeta">Eternal実Spawnが2回以上あるエリアから本命時刻を出します。</div></div>';
 const latest=eternal.slice(-1)[0];
 const latestText=latest?(biomeJa((REAL_EGGS.find(e=>e[0]===liveEggName(latest))||[])[2])+' '+eggJa(liveEggName(latest))+' '+fmt(latest.t)):'まだなし';
 box.innerHTML='<div class="targetbox"><div class="targethead"><b>🏆 近い順に5エリア</b><span class="targethot">Eternal限定</span></div><div style="font-size:18px;font-weight:800;line-height:1.55">通常・光・Secretは本命から除外。Eternalの出現間隔をエリア別に計算し、特大の手動記録で補正します。</div><div class="targetmeta">最新Eternal：'+latestText+' ／ 全Eternal実Spawn '+eternal.length+'件</div></div>'+cards;
}

function predictionAccuracy(){
 const ss=loadJ(SKEY).filter(x=>Number.isFinite(Number(x.t))).sort((a,b)=>a.t-b.t);
 if(ss.length<13)return {ready:false,total:0,hits:0};
 let total=0,hits=0;
 const start=Math.max(12,ss.length-20);
 for(let i=start;i<ss.length;i++){
   const train=ss.slice(0,i);
   if(train.length<12)continue;
   const predicted=scoreCandidates(train).slice(0,6).map(r=>norm(r.name));
   total++;
   if(predicted.includes(norm(liveEggName(ss[i]))))hits++;
 }
 return {ready:total>0,total,hits,pct:total?Math.round(hits/total*100):0};
}

  : '<span class="badge">🎯 的中率集計中</span><span class="muted"> 実Spawnがたまると自動表示します</span>';
}

 const n=Math.abs(Number(key)||0);
 return lines[n%lines.length];
}
function leoAdvice(confidence,safeHot,normalMisses,learning=false){
 const key=Math.floor(nextBoundary()/(5*60*1000));
 if(learning){

function render(){
 try{
 const m=predictionModel(), ss=loadJ(SKEY).filter(x=>Number.isFinite(Number(x.t))).sort((a,b)=>a.t-b.t);
 if(!m.ready){
   const demo=REAL_EGGS.filter(e=>['Secret','Eternal','Divine'].includes(e[1])).slice(-6);
   const base=nextBoundary();
   $('#rows').innerHTML='<div class="small muted" style="margin-bottom:8px">🥚 予測準備中 ／ 実データ '+m.n+'件</div><div class="predictgrid">'+demo.map((e,i)=>{
     const biome=e[2]||'場所不明';
     const when=new Date(base+i*5*60000).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
     return `<div class="predictcard">${eggPic(e[0])}<div class="egg">${eggJa(e[0])}</div><div class="place">${biomeJa(biome)}</div><div class="ptime">${when}</div><div class="tag miss">準備中</div></div>`;
   }).join('')+'</div>'+leoAdviceHtml(leoAdvice('low',false,0,true));
   renderAccuracy();renderLightPrediction();renderTargetPrediction();stats();return;
 }
 const ranked=scoreCandidates(ss).slice(0,6), base=nextBoundary();
 const recentManual=history().filter(x=>x&&Number.isFinite(Number(x.t))).sort((a,b)=>b.t-a.t).slice(0,3);
 const normalMisses=recentManual.filter(x=>x.egg==='通常卵').length;
 const safeHot=m.confidence==='high'&&normalMisses<2;
 const note=normalMisses>=2?'直近ノーマル多発・激アツ抑制中':m.confidence==='high'?'高信頼':m.confidence==='medium'?'参考予想':'低信頼';
 $('#rows').innerHTML='<div class="small muted" style="margin-bottom:8px">📊 予想v4 ／ '+note+' ／ '+ss.length+'件学習</div><div class="predictgrid">'+ranked.map((r,i)=>{
   const when=new Date(base+i*5*60000).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
   const label=i===0&&safeHot?'🔥 激アツ':i<3?'✨ 候補':'参考';
   const klass=i===0&&safeHot?'hot':i<3?'chance':'miss';
   const pct=Math.round(r.count/Math.max(1,ss.length)*100);
   const hit=REAL_EGGS.find(e=>norm(e[0])===norm(r.name));
   const biome=hit?hit[2]:'';
   return `<div class="predictcard">${eggPic(r.name)}<div class="egg">${eggJa(r.name)}</div><div class="place">${biomeJa(biome)}</div><div class="ptime">${when}</div><div class="tag ${klass}">${label}</div></div>`;
 }).join('')+'</div>'+leoAdviceHtml(leoAdvice(m.confidence,safeHot,normalMisses));
 renderAccuracy();renderLightPrediction();renderTargetPrediction();stats();
 }catch(e){const r=$('#rows');if(r)r.innerHTML='<div class="small bad">予測表示を再読み込み中…</div>';}

function tick(){

 if(left<1200 && soundOn && !window._beeped){beep(900,.12);window._beeped=true}

}

function dayTimeToTs(hm){let [h,m]=hm.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);return d.getTime()}
function fmtTs(t){let d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function norm(x){return (x||'').toLowerCase().replace(/egg/g,'').replace(/[^a-z0-9]/g,'')}
function renderIntel(){
 let ss=loadJ(SKEY).sort((a,b)=>b.t-a.t);

}
function extractLiveSpawns(html){
 try{
  const doc=new DOMParser().parseFromString(html,'text/html');
  const text=(doc.body?.innerText||'').replace(/\r/g,'');
  let out=[];
  const blocks=text.split(/\n{2,}/);
  for(const b of blocks){
   if(!/(Secret|Eternal|Divine|rare egg|spawn)/i.test(b))continue;
   const tm=b.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
   const rarity=(b.match(/\b(Secret|Eternal|Divine)\b/i)||[])[1]||'Rare';
   const loc=(b.match(/(?:Biome|Location)\s*[:\-]\s*([^\n]+)/i)||[])[1]||'';
   const lines=b.split('\n').map(x=>x.trim()).filter(Boolean);
   let egg=lines.find(x=>/egg$/i.test(x)&&!/rare eggs/i.test(x))||'';
   if(!egg){const m=b.match(/(?:Secret|Eternal|Divine)\s+(?:Egg\s*)?[:\-]?\s*([^\n]+)/i);if(m)egg=m[1].trim();}
   if(egg&&tm)out.push({egg,loc,hm:tm[0],rarity});
  }
  return out;
 }catch(e){return []}
}
function liveEggName(x){
 const raw=String(x.pet||x.egg||'').trim();
 if(!raw)return 'Unknown Egg';
 let slug=raw;
 const m=raw.match(/\/([^/]+?)-s\.webp(?:\?.*)?$/i); if(m)slug=m[1];
 slug=slug.replace(/^.*\//,'').replace(/-egg$/i,'').replace(/[-_]+/g,' ').trim();
 const key=norm(slug);
 const hit=REAL_EGGS.find(e=>norm(e[0])===key);
 if(hit)return hit[0];
 return slug.replace(/\b\w/g,ch=>ch.toUpperCase())+' Egg';
}
function repairSpawnHistory(){
 let a=loadJ(SKEY), changed=false;
 a=a.map(z=>{
   const egg=liveEggName(z);
   const t=Number(z.ts)||Number(z.t);
   const id=norm(egg)+'|'+Math.floor(t/60000);
   if(egg!==z.egg||id!==z.id||t!==z.t)changed=true;
   return {...z,id,egg,t};
 }).filter(z=>Number.isFinite(z.t)&&z.egg!=='Unknown Egg');
 if(changed)saveJ(SKEY,a);
}
function addAutoSpawn(x){
 let a=loadJ(SKEY), t=Number(x.ts)||Number(x.t)||dayTimeToTs(x.hm), egg=liveEggName(x), id=norm(egg)+'|'+Math.floor(t/60000);
 if(a.some(z=>(z.id||'')===id))return false;
 a.push({id,egg,loc:x.loc||x.biome||'',t,rarity:x.rarity||'Rare',source:'Eggipedia Live'});saveJ(SKEY,a);return true;
}
