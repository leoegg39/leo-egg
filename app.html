<body><main><div><b>LEO EGG</b><p>最新版を確認しています…</p></div></main>
<script>
(async()=>{
 try{
  const r=await fetch('./latest.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw 0;
  const j=await r.json();
  const file=j.file||'leo-future-774.html';
  location.replace('./'+file+'?build='+(j.build||'latest')+'&t='+Date.now());
 }catch(e){
  location.replace('./leo-future-774.html?t='+Date.now());
 }
})();
</script></body></html>
