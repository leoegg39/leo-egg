name: LEO EGG History Collector

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/live-collector.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch public history when available
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.request, datetime, html as htmlmod, os
          url="https://eggipedia.com/spawns"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 LEO-EGG","Cache-Control":"no-cache","Pragma":"no-cache"})
          now=datetime.datetime.now(datetime.timezone.utc)
          try:
              raw=urllib.request.urlopen(req,timeout=20).read().decode("utf-8","replace")
              # Inspect Eggipedia's dedicated live client to discover its real alert transport/API.
              live_js=""
              try:
                  from urllib.parse import urljoin
                  # Eggipedia currently exposes this exact asset in the page HTML.
                  # Prefer parsed src, but fall back to the known public asset path so
                  # a parser mismatch cannot block transport discovery again.
                  script_candidates=re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)',raw,re.I)
                  live_src=next((s for s in script_candidates if "live.js" in s.lower()),None)
                  if not live_src and "/assets/live.js" in raw:
                      vm=re.search(r'/assets/live[.]js[^"\\\'< >]*',raw,re.I)
                      live_src=vm.group(0) if vm else "/assets/live.js"
                  live_url=urljoin("https://eggipedia.com/",live_src) if live_src else "https://eggipedia.com/assets/live.js"
                  if live_url:
                      # Use browser-like headers; some CDNs reject bare script requests.
                      lreq=urllib.request.Request(live_url,headers={
                          "User-Agent":"Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1",
                          "Accept":"*/*","Referer":url,"Cache-Control":"no-cache","Pragma":"no-cache"
                      })
                      live_js=urllib.request.urlopen(lreq,timeout=20).read().decode("utf-8","replace")
                      # live.js reveals the public JSON transport. Fetch it directly.
                      spawn_json_url=urljoin("https://eggipedia.com/", "/live/spawns.json")
                      try:
                          sreq=urllib.request.Request(spawn_json_url,headers={
                              "User-Agent":"Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1",
                              "Accept":"application/json,text/plain,*/*","Referer":url,
                              "Cache-Control":"no-cache","Pragma":"no-cache"
                          })
                          spawn_json_raw=urllib.request.urlopen(sreq,timeout=20).read().decode("utf-8","replace")
                          try:
                              spawn_json_data=json.loads(spawn_json_raw)
                              spawn_json_error=""
                          except Exception as je:
                              spawn_json_data=None
                              spawn_json_error="JSON parse: "+str(je)
                      except Exception as se:
                          spawn_json_raw=""
                          spawn_json_data=None
                          spawn_json_error=str(se)
              except Exception as live_err:
                  live_js=""
                  live_js_error=str(live_err)
              else:
                  live_js_error=""
              text=htmlmod.unescape(re.sub(r"<[^>]+>","\n",raw))
              text=re.sub(r"[ \t]+"," ",text)
              paused=bool(re.search(r"Alerts paused",text,re.I))
              no_history=bool(re.search(r"No rare egg spotted yet",text,re.I))
              # Parse live/history entries conservatively. Only save rows that contain an Egg name.
              clean=[x.strip() for x in text.splitlines() if x.strip()]
              spawns=[]
              rarity_re=re.compile(r"^(Rare|Epic|Legendary|Mythic|Cosmic|Secret|Eternal|Divine)$",re.I)
              biome_names={"Forest","Lake","Desert","Jungle","Snow","Volcano","Abyss Ocean","Prehistoric","Cosmic","Cherry Blossom","Titan Temple","Angels & Demons"}
              for i,line in enumerate(clean):
                  if " Egg" not in line or len(line)>120: continue
                  # Ignore navigation/help prose and keep plausible egg labels.
                  if any(x in line.lower() for x in ["every animal","rare eggs spawning","luminous version","special eggs"]): continue
                  egg=line
                  rarity=next((clean[j] for j in range(max(0,i-3),min(len(clean),i+4)) if rarity_re.match(clean[j])),None)
                  biome=next((clean[j] for j in range(max(0,i-4),min(len(clean),i+5)) if clean[j] in biome_names),None)
                  tm=next((clean[j] for j in range(max(0,i-3),min(len(clean),i+4)) if re.search(r"\b\d{1,2}:\d{2}\b|\b\d+\s*(?:m|min|minutes?)\s*ago\b",clean[j],re.I)),None)
                  if rarity or biome or tm:
                      key=(egg,rarity or "",biome or "",tm or "")
                      if not any(x.get("_key")==key for x in spawns):
                          spawns.append({"_key":key,"egg":egg,"rarity":rarity,"biome":biome,"timeText":tm})
              # Convert the real Eggipedia JSON feed into the LEO EGG schema.
              # live.js validates each item with pet + at; preserve extra fields when present.
              if isinstance(spawn_json_data,dict) and isinstance(spawn_json_data.get("spawns"),list):
                  for s in spawn_json_data["spawns"]:
                      if not isinstance(s,dict): continue
                      egg=s.get("egg") or s.get("name") or s.get("pet")
                      at=s.get("at") or s.get("spawnedAt") or s.get("time")
                      if not egg or not at: continue
                      try:
                          ts=int(datetime.datetime.fromisoformat(str(at).replace("Z","+00:00")).timestamp()*1000)
                      except Exception:
                          continue
                      spawns.append({"egg":str(egg),"rarity":s.get("rarity"),"biome":s.get("biome") or s.get("location"),
                                     "loc":s.get("biome") or s.get("location") or "","timeText":str(at),"ts":ts,
                                     "source":"Eggipedia JSON"})
              # Probe SaneStats as a second public source. Diagnostics only until a timestamped spawn feed is verified.
              sane_diag={"url":"https://sanestats.com/","ok":False}
              try:
                  sane_url="https://sanestats.com/"
                  q=urllib.request.Request(sane_url,headers={"User-Agent":"Mozilla/5.0 LEO-EGG","Cache-Control":"no-cache"})
                  sane_raw=urllib.request.urlopen(q,timeout=20).read().decode("utf-8","replace")
                  sane_scripts=re.findall(r"<script[^>]+src=[\"']([^\"']+)",sane_raw,re.I)
                  sane_hints=[]
                  sane_script_diag=[]
                  for src in sane_scripts[-30:]:
                      try:
                          js_url=urljoin(sane_url,src)
                          jr=urllib.request.Request(js_url,headers={"User-Agent":"Mozilla/5.0 LEO-EGG","Referer":sane_url})
                          js=urllib.request.urlopen(jr,timeout=15).read().decode("utf-8","replace")
                          hints=re.findall(r"(?:https?|wss?)://[^\\\"' )]+|/(?:api|spawn|spawns|history|events|stream)[A-Za-z0-9_?&=./:-]*",js,re.I)
                          sane_hints.extend(hints)
                          sane_script_diag.append({"url":js_url,"bytes":len(js),"hints":hints[:20]})
                      except Exception as e:
                          sane_script_diag.append({"url":urljoin(sane_url,src),"error":str(e)})
                  sane_diag={"url":sane_url,"ok":True,"htmlBytes":len(sane_raw),"scripts":sane_scripts[-30:],"hasCurrentSpawns":bool(re.search(r"Current spawns",sane_raw,re.I)),"hasRareHistory":bool(re.search(r"rare spawn history",sane_raw,re.I)),"waiting":bool(re.search(r"Waiting for the next hatch",sane_raw,re.I)),"transportHints":sorted(set(sane_hints))[:100],"scriptDiagnostics":sane_script_diag}
                  # Verified public endpoint discovered from the site's own JS.
                  # Import only timestamped rare-history records; never import the 156-pet index.
                  try:
                      hu=urljoin(sane_url,"/api/history?limit=500")
                      hr=urllib.request.Request(hu,headers={"User-Agent":"Mozilla/5.0 LEO-EGG","Referer":sane_url,"Accept":"application/json"})
                      hb=urllib.request.urlopen(hr,timeout=20).read()
                      sane_diag["historyBytes"]=len(hb)
                      hj=json.loads(hb.decode("utf-8","replace"))
                      sane_diag["historyType"]=type(hj).__name__
                      rows=hj if isinstance(hj,list) else next((hj.get(k) for k in ("history","spawns","events","data","items","results") if isinstance(hj.get(k),list)),[])
                      sane_diag["historyRows"]=len(rows)
                      sane_diag["historyPreview"]=rows[:2]
                      imported=0
                      for r in rows:
                          if not isinstance(r,dict): continue
                          name=next((r.get(k) for k in ("pet","petName","name","egg") if r.get(k)),None)
                          rarity=next((r.get(k) for k in ("rarity","tier","rank") if r.get(k)),None)
                          at=next((r.get(k) for k in ("at","timestamp","createdAt","created_at","time","spawnedAt","spawned_at") if r.get(k) is not None),None)
                          if not name or at is None: continue
                          if rarity and str(rarity).lower() not in ("secret","eternal","divine"): continue
                          try:
                              if isinstance(at,(int,float)):
                                  ts=int(at if at>100000000000 else at*1000)
                              else:
                                  ts=int(datetime.datetime.fromisoformat(str(at).replace("Z","+00:00")).timestamp()*1000)
                          except Exception: continue
                          biome=next((r.get(k) for k in ("biome","location","area","world") if r.get(k)),None)
                          spawns.append({"egg":str(name),"rarity":rarity or "Rare","biome":biome,"loc":biome or "","timeText":str(at),"ts":ts,"source":"SaneStats history"})
                          imported+=1
                      sane_diag["historyImported"]=imported
                  except Exception as he:
                      sane_diag["historyError"]=str(he)
              except Exception as sane_err:
                  sane_diag["error"]=str(sane_err)
              # Preserve previous history and append only newly parsed entries.
              old=[]
              try:
                  old=json.load(open("live.json")).get("spawns",[])
              except Exception: pass
              merged=old[:]
              seen={(x.get("egg"),x.get("rarity"),x.get("biome"),x.get("timeText")) for x in merged}
              for x in spawns:
                  k=(x.get("egg"),x.get("rarity"),x.get("biome"),x.get("timeText"))
                  if k not in seen:
                      x.pop("_key",None); x["t"]=int(now.timestamp()*1000)
                      merged.append(x); seen.add(k)
              # Diagnostics: keep enough state to distinguish "collector broken" from "source has no alerts".
              script_srcs=re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)',raw,re.I)
              live_hints=sorted(set(re.findall(r'https?://[^"\\\'<> ]+|/(?:api|live|spawn|alert)[^"\\\'<> ]*',raw,re.I)))
              data={"ok":True,"checkedAt":now.isoformat(),"source":url,"paused":paused,
                    "noHistory":no_history,"parsedNow":len(spawns),"spawns":merged[-1000:],
                    "diagnostics":{"htmlBytes":len(raw),"scriptCount":len(script_srcs),
                    "scripts":script_srcs[-20:],"liveHints":live_hints[-30:],
                    "connecting":bool(re.search(r"Connecting to the alerts",text,re.I)),
                    "liveJsUrl":live_url if 'live_url' in locals() else "","liveJsBytes":len(live_js),"liveJsError":live_js_error,
                    "spawnJsonUrl":spawn_json_url if 'spawn_json_url' in locals() else "",
                    "spawnJsonBytes":len(spawn_json_raw) if 'spawn_json_raw' in locals() else 0,
                    "spawnJsonError":spawn_json_error if 'spawn_json_error' in locals() else "",
                    "spawnJsonPreview":str(spawn_json_data)[:1500] if 'spawn_json_data' in locals() else "",
                    "transportHints":sorted(set(re.findall(r'(?:https?://|wss?://)[^"\\\' )]+|/(?:api|events|stream|spawn|alert)[A-Za-z0-9_?&=./-]*',live_js,re.I)))[:50],
                    "liveJsContexts":[live_js[max(0,m.start()-500):min(len(live_js),m.end()+700)] for m in list(re.finditer(r'spawns(?:[.]json)?|EventSource|WebSocket|fetch\\s*[(]|XMLHttpRequest',live_js,re.I))[:12]],
                    "saneStats":sane_diag,"liveJsFetchCalls":re.findall(r'(?:fetch|EventSource|WebSocket)\\s*[(]\\s*([^)]{1,300})[)]',live_js,re.I)[:20]}}
          except Exception as e:
              old=[]
              try: old=json.load(open("live.json")).get("spawns",[])
              except Exception: pass
              data={"ok":False,"checkedAt":now.isoformat(),"source":url,"error":str(e),"spawns":old[-200:]}
          # Write only when real Spawn history changed. Diagnostics/check time alone
          # must not create a commit, otherwise Pages rebuilds every five minutes.
          old_spawns=old[-1000:]
          new_spawns=data.get("spawns",[])
          if new_spawns != old_spawns:
              open("live.json","w").write(json.dumps(data,ensure_ascii=False,indent=2))
          PY

      - name: Commit live status
        shell: bash
        run: |
          git config user.name "leo-egg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live.json
          git diff --cached --quiet && exit 0
          git commit -m "Update LEO EGG history data"
          git push
