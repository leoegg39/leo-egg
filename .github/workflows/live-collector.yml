name: LEO EGG Live Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch public live page
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.request, datetime
          url="https://eggipedia.com/spawns"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 LEO-EGG"})
          try:
              html=urllib.request.urlopen(req,timeout=20).read().decode("utf-8","replace")
              text=re.sub(r"<[^>]+>","\n",html)
              text=re.sub(r"&nbsp;"," ",text)
              paused=bool(re.search(r"Alerts paused",text,re.I))
              no_history=bool(re.search(r"No rare egg spotted yet",text,re.I))
              data={"ok":True,"checkedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    "source":url,"paused":paused,"noHistory":no_history,
                    "spawns":[]}
          except Exception as e:
              data={"ok":False,"checkedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    "source":url,"error":str(e),"spawns":[]}
          open("live.json","w").write(json.dumps(data,ensure_ascii=False,indent=2))
          PY
      - name: Commit live status
        shell: bash
        run: |
          git config user.name "leo-egg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live.json
          git diff --cached --quiet && exit 0
          git commit -m "Update LEO EGG live status"
          git push
